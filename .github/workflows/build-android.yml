name: Build Android APK & AAB (Release)

on:
  workflow_dispatch:      # manually "Run workflow" button se trigger karo
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon & splash screen from resources/
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor plugins (push notifications etc.)
        run: npx cap sync android

      - name: Patch MainActivity.java (UPI payment fix)
        run: |
          TARGET="android/app/src/main/java/com/xevrontech/studybuddyzone/MainActivity.java"
          cp android-patch/MainActivity.java "$TARGET"

      - name: Patch AndroidManifest.xml (add queries block for UPI apps)
        run: |
          python3 - <<'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          with open("android-patch/queries-snippet.xml") as f:
              snippet = f.read()
          content = re.sub(r'(<manifest[^>]*>)', r'\1\n' + snippet, content, count=1)
          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Patch AndroidManifest.xml (declare POST_NOTIFICATIONS for Android 13+)
        run: |
          python3 - <<'EOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          perm = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if "android.permission.POST_NOTIFICATIONS" not in content:
              content = content.replace("</manifest>", "    " + perm + "\n</manifest>", 1)
              with open(path, "w") as f:
                  f.write(content)
          EOF

      - name: Copy google-services.json
        run: cp android-patch/google-services.json android/app/google-services.json

      - name: Patch build.gradle files for google-services plugin
        run: |
          sed -i "s#classpath 'com.android.tools.build:gradle.*#&\n        classpath 'com.google.gms:google-services:4.4.2'#" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

      - name: Decode release keystore
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore/release.jks

      - name: Add signing config to build.gradle
        run: |
          python3 - <<'EOF'
          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          signing_config = '''
          signingConfigs {
              release {
                  storeFile file("keystore/release.jks")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }
          buildTypes {
              release {
                  signingConfig signingConfigs.release
                  minifyEnabled false
              }
          }
          '''
          content = content.replace(
              "android {",
              "android {\n" + signing_config,
              1
          )
          with open(path, "w") as f:
              f.write(content)
          EOF

      - name: Set version code from run number
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build release APK & AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: studybuddyzone-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: studybuddyzone-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
