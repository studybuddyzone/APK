name: Build Windows MSIX (Release)

# Kept in its own workflow file so a Windows build failure can never affect
# or block the existing Android build-android.yml workflow or its
# already-uploaded APK/AAB artifacts. Runs automatically on every push to
# main (same as build-android.yml), and can also be triggered manually.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve Package Identity values
        id: identity
        shell: pwsh
        run: |
          $identityName = "${{ vars.WINDOWS_PACKAGE_IDENTITY_NAME }}"
          $publisher = "${{ vars.WINDOWS_PACKAGE_PUBLISHER }}"
          $publisherDisplay = "${{ vars.WINDOWS_PACKAGE_PUBLISHER_DISPLAY_NAME }}"

          if ([string]::IsNullOrWhiteSpace($identityName)) {
            Write-Warning "WINDOWS_PACKAGE_IDENTITY_NAME variable not set - using a placeholder identity. This package will NOT be accepted by the Microsoft Store until you set the real value from Partner Center."
            $identityName = "StudyBuddyZonePlaceholder.Xevrontech"
          }
          if ([string]::IsNullOrWhiteSpace($publisher)) {
            Write-Warning "WINDOWS_PACKAGE_PUBLISHER variable not set - using a placeholder publisher. Set the real value (e.g. CN=XXXXXXXX-XXXX-...) from Partner Center."
            $publisher = "CN=StudyBuddyZoneDevPlaceholder"
          }
          if ([string]::IsNullOrWhiteSpace($publisherDisplay)) {
            $publisherDisplay = "Xevrontech"
          }

          # 4-part MSIX version, build number goes in the 3rd slot.
          $pkgVersion = "1.0.${{ github.run_number }}.0"

          echo "identity_name=$identityName" >> $env:GITHUB_OUTPUT
          echo "publisher=$publisher" >> $env:GITHUB_OUTPUT
          echo "publisher_display=$publisherDisplay" >> $env:GITHUB_OUTPUT
          echo "pkg_version=$pkgVersion" >> $env:GITHUB_OUTPUT

      - name: Inject Package Identity into Package.appxmanifest
        shell: pwsh
        run: |
          $path = "windows/Package.appxmanifest"
          $content = Get-Content -Path $path -Raw
          $content = $content.Replace('__PACKAGE_IDENTITY_NAME__', '${{ steps.identity.outputs.identity_name }}')
          $content = $content.Replace('__PACKAGE_PUBLISHER__', '${{ steps.identity.outputs.publisher }}')
          $content = $content.Replace('__PACKAGE_PUBLISHER_DISPLAY_NAME__', '${{ steps.identity.outputs.publisher_display }}')
          $content = $content.Replace('__PACKAGE_VERSION__', '${{ steps.identity.outputs.pkg_version }}')
          Set-Content -Path $path -Value $content

      - name: Prepare signing certificate
        id: cert
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "studybuddyzone-signing.pfx"

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_PFX_BASE64)) {
            # Use the org's real code-signing certificate if it was provided as a secret.
            Write-Host "Using WINDOWS_PFX_BASE64 secret for package signing."
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            $pfxPassword = $env:WINDOWS_PFX_PASSWORD
          } else {
            # No org certificate supplied: generate a throwaway self-signed
            # certificate for this run only, so the MSIX can be built and
            # locally test-installed. Microsoft Store re-signs the package
            # with its own certificate on ingestion, so this is sufficient
            # for producing a Store-submittable .msixupload/.msixbundle.
            Write-Warning "WINDOWS_PFX_BASE64 secret not set - generating a temporary self-signed certificate for this run."
            $publisher = '${{ steps.identity.outputs.publisher }}'
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject $publisher `
              -KeyUsage DigitalSignature `
              -FriendlyName "StudyBuddyZone CI Signing (ephemeral)" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -KeyExportPolicy Exportable `
              -KeyAlgorithm RSA `
              -KeyLength 2048 `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

            $pfxPassword = [System.Guid]::NewGuid().ToString("N")
            $securePwd = ConvertTo-SecureString -String $pfxPassword -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePwd | Out-Null
          }

          echo "pfx_path=$pfxPath" >> $env:GITHUB_OUTPUT
          # Mask the password in logs and pass it to later steps.
          echo "::add-mask::$pfxPassword"
          echo "pfx_password=$pfxPassword" >> $env:GITHUB_OUTPUT

      - name: Import signing certificate into cert store
        id: import
        shell: pwsh
        env:
          PFX_PATH: ${{ steps.cert.outputs.pfx_path }}
          PFX_PASSWORD: ${{ steps.cert.outputs.pfx_password }}
        run: |
          # MSBuild's MSIX packaging targets (APPX0105/APPX0107) cannot import
          # a password-protected .pfx file directly via PackageCertificateKeyFile
          # + PackageCertificatePassword - this is a documented limitation, not
          # a bug in our cert. Workaround: import the pfx into the current
          # user's personal cert store ourselves, then reference it by
          # Thumbprint instead.
          $securePwd = ConvertTo-SecureString -String $env:PFX_PASSWORD -Force -AsPlainText
          $imported = Import-PfxCertificate `
            -FilePath $env:PFX_PATH `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePwd `
            -Exportable

          $thumbprint = $imported.Thumbprint
          Write-Host "Imported signing certificate, thumbprint: $thumbprint"
          echo "thumbprint=$thumbprint" >> $env:GITHUB_OUTPUT

      - name: Restore NuGet packages
        run: msbuild windows\StudyBuddyZoneWindows.csproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build signed MSIX / MSIXBundle
        shell: pwsh
        run: |
          # Note: only /t:Build is passed (not a chained "Build;_GenerateAppxPackageOnBuild"
          # target list). When /restore is combined with an explicit target list in the same
          # invocation, MSBuild resolves the target list BEFORE restore runs, so the private
          # _GenerateAppxPackageOnBuild target (which only exists after the Windows App SDK
          # NuGet package's targets are restored) isn't found yet -> MSB4057. Setting
          # GenerateAppxPackageOnBuild=true is enough; it hooks itself in via AfterTargets="Build"
          # once the package's .targets file is imported, so it still runs automatically.
          msbuild windows\StudyBuddyZoneWindows.csproj `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms="x64" `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="${{ steps.import.outputs.thumbprint }}" `
            /p:AppxPackageDir="${{ github.workspace }}\windows\AppPackages\" `
            /restore

      - name: List generated packages
        shell: pwsh
        run: Get-ChildItem -Recurse "windows\AppPackages" | Select-Object FullName

      - name: Upload Windows MSIX/MSIXBundle
        uses: actions/upload-artifact@v4
        with:
          name: studybuddyzone-windows-msix
          path: |
            windows/AppPackages/**/*.msix
            windows/AppPackages/**/*.msixbundle
            windows/AppPackages/**/*.msixupload
            windows/AppPackages/**/*.cer
          if-no-files-found: error
