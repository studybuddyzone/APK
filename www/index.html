<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>StudyBuddyZone</title>

  <meta name="description" content="StudyBuddyZone - your all-in-one study companion." />
  <meta name="application-name" content="StudyBuddyZone" />
  <meta name="theme-color" content="#ffffff" />

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <!-- iOS/Android PWA install hints -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="StudyBuddyZone" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 24px;
      max-width: 380px;
      width: 90%;
    }
    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 18px;
      border-radius: 20px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      display: block;
    }
    .app-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .status-text {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #2563eb;
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error-card {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .retry-btn {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      transition: background-color 0.2s, transform 0.1s;
    }
    .retry-btn:active {
      transform: scale(0.98);
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="icons/icon-192.png" alt="StudyBuddyZone" class="logo" />
    <div class="app-title">StudyBuddyZone</div>

    <div id="loadingSection">
      <div class="spinner"></div>
      <div class="status-text" id="statusMessage">Connecting to StudyBuddyZone...</div>
    </div>

    <div id="errorSection" class="error-card">
      <div class="status-text" id="errorMessage">Unable to connect. Please check your internet connection and try again.</div>
      <button class="retry-btn" id="retryButton" onclick="attemptConnect()">Retry</button>
    </div>
  </div>

  <script>
    var START_URL = "https://studybuddypro-psi.vercel.app/";
    var loadingSec = document.getElementById("loadingSection");
    var errorSec = document.getElementById("errorSection");

    function showError(msg) {
      if (loadingSec) loadingSec.style.display = "none";
      if (errorSec) {
        errorSec.style.display = "block";
        if (msg) document.getElementById("errorMessage").textContent = msg;
      }
    }

    function showLoading() {
      if (loadingSec) loadingSec.style.display = "block";
      if (errorSec) errorSec.style.display = "none";
    }

    function attemptConnect() {
      showLoading();
      if (!navigator.onLine) {
        showError("Device is offline. Please check your internet connection.");
        return;
      }
      window.location.replace(START_URL);
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("service-worker.js").catch(function () {});
      });
    }

    // Attempt connection
    window.addEventListener("DOMContentLoaded", function () {
      if (!navigator.onLine) {
        showError("Device is offline. Please check your internet connection.");
      } else {
        setTimeout(function () {
          window.location.replace(START_URL);
        }, 100);
      }
    });

    window.addEventListener("offline", function () {
      showError("Device is offline. Please check your internet connection.");
    });

    window.addEventListener("online", function () {
      attemptConnect();
    });
  </script>
</body>
</html>
